{% extends "base.html" %}
{% block title %}Account security{% endblock %}
{% block content %}
<section class="narrow">
  <div class="eyebrow">ACCOUNT SECURITY</div><h1>Update your credentials</h1>
  <p class="muted">Use a unique password with at least 10 characters, including a letter and a number.</p>
  <form class="clay form-card" method="post">
    <label>New login ID (optional)<input name="new_username" value="{{ current_user.username }}"></label>
    <label>Current password<input type="password" name="current_password" required></label>
    <label>New password<input type="password" name="new_password" minlength="10" required></label>
    <label>Confirm new password<input type="password" name="confirm_password" minlength="10" required></label>
    <button class="primary" type="submit">Save credentials</button>
  </form>
</section>
{% endblock %}
